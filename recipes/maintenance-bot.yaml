id: maintenance_bot
name: "Maintenance — branches, deps, cleanup"
description: "Identifies stale branches, deprecated dependencies, dead code, and accumulating tech debt. Proposes cleanup patches or surfaces decisions-needed."

triggers:
  - has_stale_branches
  - user_mentioned:maintenance
  - user_mentioned:cleanup
  - user_mentioned:deps
  - user_mentioned:upgrade

required_services:
  - github
helpful_services: []

default_settings:
  iterate: true
  max_actions_per_run: 10
  cap_minutes_per_action: 15
  patch_class: experimental

gather_steps:
  description: |
    Scan project for:
      - Branches older than 30d with no recent commits (`git for-each-ref --sort=committerdate`)
      - Dependencies in package.json/requirements.txt etc. that are >2 major versions behind
      - Dead exports (knip/deadcode/vulture)
      - Unused files (manually checking import graphs is hard — use available tools or skip)
      - Commented-out code blocks present for >30d

  bash_pattern: |
    # Stale branches (git is universal). Use git's own date math via committerdate:unix
    # — portable across macOS BSD awk and GNU awk (the previous mktime/systime
    # approach was gawk-only and silently produced empty output on macOS).
    NOW=$(date +%s)
    git for-each-ref --sort=committerdate refs/heads/ \
      --format='%(refname:short)|%(committerdate:unix)|%(committerdate:relative)' | \
      awk -F'|' -v now="$NOW" '{ age_days=(now-$2)/86400; if(age_days>30) print $1 " | " $3 " (" int(age_days) "d)" }'

    # Dep audit — detect package manager from lockfile, run matching tool.
    # Skip silently if no lockfile or tool not installed.
    cd "$USER_REPO"
    if   [ -f package-lock.json ]   && command -v npm >/dev/null;   then npm outdated --json 2>/dev/null
    elif [ -f yarn.lock ]           && command -v yarn >/dev/null;  then yarn outdated --json 2>/dev/null
    elif [ -f pnpm-lock.yaml ]      && command -v pnpm >/dev/null;  then pnpm outdated --format json 2>/dev/null
    elif [ -f Cargo.lock ]          && command -v cargo >/dev/null; then cargo outdated --format=json 2>/dev/null
    elif [ -f Pipfile.lock ]        && command -v pipenv >/dev/null;then pipenv update --outdated 2>/dev/null
    elif [ -f poetry.lock ]         && command -v poetry >/dev/null;then poetry show --outdated 2>/dev/null
    elif [ -f requirements.txt ]    && command -v pip >/dev/null;   then pip list --outdated --format=json 2>/dev/null
    elif [ -f go.sum ]              && command -v go >/dev/null;    then go list -u -m -json all 2>/dev/null
    elif [ -f Gemfile.lock ]        && command -v bundle >/dev/null;then bundle outdated --parseable 2>/dev/null
    elif [ -f composer.lock ]       && command -v composer >/dev/null; then composer outdated --format=json 2>/dev/null
    elif [ -f pubspec.lock ]        && command -v dart >/dev/null;  then dart pub outdated --json 2>/dev/null
    else echo '{"info":"no recognized lockfile / package manager; skipping dep audit"}'
    fi

implementation_pattern:
  description: |
    For each finding category:
      1. Stale branches: list in brief, propose deletion command in brief (user runs it). Do NOT auto-delete.
      2. Dep upgrades within minor: propose patch with version bump + run verify. If passes, ship as PR (per delivery config).
      3. Dep upgrades across major: NEVER auto-bump. Surface as decisions-needed with link to changelog.
      4. Dead exports: propose removal patch + re-run user's configured verify methods (Q5.1) — typecheck/lint/test should still pass with the export removed.
      5. Old commented-out code: propose removal patch with git blame note ("removed N-month-old commented block").

  brief_section: |
    Sections:
      - Stale branches (count + list + deletion command)
      - Dependencies needing attention (count by severity)
      - Dead code candidates (count + sample)
      - Patches delivered

  reviewer_persona_relevance: MEDIUM
  argent_relevance: LOW

failure_modes:
  - "Major dep bump breaks tests": NEVER ship the patch; flag as decisions-needed with full failure log
  - "User asked you to KEEP a stale branch": honor it (check memory if available)
  - "Dead code that's actually called via reflection / dynamic import": don't remove; flag
